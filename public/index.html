<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HR Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header button {
    background: transparent;
    border: 1px solid #475569;
    color: #cbd5e1;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { background: #334155; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
  }
  .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
  .assistant a { color: #60a5fa; }
  .error { align-self: flex-start; background: #7f1d1d; color: #fecaca; }

  .step {
    align-self: flex-start;
    font-size: 12px;
    color: #94a3b8;
    background: #111827;
    border-left: 3px solid #475569;
    padding: 6px 10px;
    border-radius: 4px;
    max-width: 85%;
    font-family: ui-monospace, SFMono-Regular, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .step.action { border-left-color: #f59e0b; color: #fbbf24; }
  .step.obs { border-left-color: #10b981; color: #6ee7b7; }

  form {
    display: flex;
    padding: 14px 20px;
    gap: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    outline: none;
  }
  input:focus { border-color: #3b82f6; }
  button[type="submit"] {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button[type="submit"]:disabled { background: #475569; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>HR Assistant</h1>
    <button id="clear">Clear</button>
  </header>

  <div id="log"></div>

  <form id="chat-form">
    <input id="input" autocomplete="off" placeholder="Ask..." autofocus />
    <button type="submit" id="send">Send</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('chat-form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addBubble(text, cls) {
  const div = document.createElement('div');
  div.className = `bubble ${cls}`;
  div.innerHTML = linkify(text);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addStep(text, cls = '') {
  const div = document.createElement('div');
  div.className = `step ${cls}`;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function linkify(text) {
  const esc = String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(/(https?:\/\/[^\s]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

document.getElementById('clear').onclick = () => { log.innerHTML = ''; };

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addBubble(message, 'user');
  input.value = '';
  sendBtn.disabled = true;

  // Streaming assistant bubble created lazily on first output
  let assistantBubble = null;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });

    if (!res.ok || !res.body) {
      throw new Error(`HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE frames separated by \n\n
      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        const line = frame.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        if (evt.kind === 'action') {
          addStep(`→ action: ${evt.function}(${JSON.stringify(evt.input)})`, 'action');
        } else if (evt.kind === 'observation') {
          addStep(`← observation: ${JSON.stringify(evt.observation)}`, 'obs');
        } else if (evt.kind === 'output') {
          assistantBubble = addBubble(evt.text, 'assistant');
        } else if (evt.kind === 'error') {
          addBubble(`Error: ${evt.message}`, 'error');
        }
        // 'done' → nothing
      }
    }
  } catch (err) {
    addBubble(`Network error: ${err.message}`, 'error');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
